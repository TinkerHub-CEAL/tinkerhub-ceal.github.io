<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gallery - TinkerHub CEAl</title>
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@1,500;1,700&display=swap"
		rel="stylesheet">
	<!-- Styles -->
	<link rel="stylesheet" href="../static/styles/style.css">
	<link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
	<!-- Ionicons -->
	<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js" defer></script>
	<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js" defer></script>
	<script src="../static/scripts/script.js" defer></script>
</head>

<body>

	<!-- Navbar -->
	<div id="navbar"></div>

	<!-- Gallery Hero Section -->
	<section class="gallery-hero container" style="padding-top: 4rem;">
		<div class="highlight-header-container">
			<div class="sticker-stack-green">EXPLORE</div>
			<div class="sticker-stack-black">GALLERY</div>
		</div>

		<!-- Filter Tabs -->
		<div class="gallery-filter-nav">
			<button class="gallery-filter-btn active" data-filter="ALL">ALL</button>
			<button class="gallery-filter-btn" data-filter="IMAGES">PHOTOS</button>
			<button class="gallery-filter-btn" data-filter="VIDEOS">VIDEOS</button>
		</div>
	</section>

	<!-- Gallery Grid Section -->
	<section class="gallery-section container" style="padding-bottom: 5rem;">
		<div class="gallery-grid" id="allGalleryGrid">
			<!-- Gallery items injected dynamically by script.js -->
		</div>
	</section>

	<!-- Footer -->
	<div id="footer"></div>

</body>

</html>
