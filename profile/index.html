<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Member Profile - TinkerHub CEAL</title>
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@1,500;1,700&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="../static/styles/style.css">
	<link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
	<!-- Ionicons -->
	<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js" defer></script>
	<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js" defer></script>
	<!-- Scripts -->
	<script src="../static/scripts/script.js" defer></script>
</head>

<body>

	<!-- Navbar -->
	<div id="navbar"></div>

	<main class="profile-container container">
		<div id="loading" class="profile-message">Loading profile...</div>

		<div id="error" class="profile-message" style="display: none;">
			<h2>Member Not Found</h2>
			<p style="color: #666; margin-top: 0.5rem;">The team member you're looking for doesn't exist.</p>
			<a href="../team/" class="back-btn">Return to Team</a>
		</div>

		<article id="profile-card" class="profile-card" style="display: none;">
			<div class="card-header">
				<div id="card-year" class="card-year"></div>
				<div class="card-brand">TinkerHub CEAL</div>
			</div>
			<div class="card-body">
				<div class="card-photo-wrapper">
					<img id="profile-image" src="" alt="Profile Photo">
				</div>
				<div class="card-info">
					<h1 id="profile-name" class="profile-name"></h1>
					<h2 id="profile-position" class="profile-position"></h2>

					<div class="quote-box">
						<p id="profile-quote" class="profile-quote"></p>
					</div>

					<div class="interests-section">
						<h3>Interests & Fields</h3>
						<div id="profile-interests" class="interests-tags">
							<!-- Tags go here -->
						</div>
					</div>

					<div class="social-section">
						<h3>Connect</h3>
						<div id="profile-socials" class="social-links">
							<!-- Social links go here -->
						</div>
					</div>
				</div>
			</div>
		</article>
	</main>

	<!-- Footer -->
	<div id="footer"></div>
</body>

</html>
