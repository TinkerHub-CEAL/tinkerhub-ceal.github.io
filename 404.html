<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>404 - Page Not Found | TinkerHub CEAL</title>
	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Playfair+Display:ital,wght@1,500;1,700&display=swap"
		rel="stylesheet">
	<!-- Styles -->
	<link rel="stylesheet" href="./static/styles/style.css">
	<link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
	<!-- Ionicons -->
	<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js" defer></script>
	<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js" defer></script>
	<script src="./static/scripts/script.js" defer></script>

	<style>
		.error-container {
			padding: 5rem 1rem 6rem 1rem;
			text-align: center;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: calc(100vh - 350px);
		}

		.error-code-badge {
			display: inline-block;
			background: #FF4081;
			color: #ffffff;
			font-weight: 800;
			font-size: 0.9rem;
			padding: 0.4rem 1.2rem;
			transform: rotate(-3deg);
			box-shadow: 3px 3px 0px #000;
			border: 2px solid #000;
			margin-bottom: 1.5rem;
			letter-spacing: 1px;
		}

		.error-title {
			font-family: var(--font-serif);
			font-size: clamp(2.5rem, 6vw, 4.5rem);
			font-weight: 700;
			line-height: 1.1;
			margin-bottom: 1.5rem;
		}

		.error-desc {
			font-size: 1.2rem;
			color: #444;
			max-width: 580px;
			margin: 0 auto 2.5rem auto;
			line-height: 1.6;
		}

		.error-card {
			background: #ffffff;
			border: 2px solid #000;
			border-radius: 16px;
			padding: 2.5rem 2rem;
			box-shadow: 6px 6px 0px #000;
			max-width: 520px;
			width: 100%;
			position: relative;
			margin-bottom: 2rem;
		}

		.error-card-badge {
			position: absolute;
			top: -15px;
			right: 20px;
			background: var(--primary-yellow);
			border: 2px solid #000;
			padding: 0.2rem 0.8rem;
			font-weight: 800;
			font-size: 0.8rem;
			transform: rotate(4deg);
			box-shadow: 2px 2px 0px #000;
		}

		.error-actions {
			display: flex;
			gap: 1rem;
			justify-content: center;
			flex-wrap: wrap;
			margin-top: 1rem;
		}

		.btn-neo {
			display: inline-flex;
			align-items: center;
			gap: 0.6rem;
			background: var(--primary-yellow);
			color: #000;
			font-weight: 800;
			font-size: 1rem;
			padding: 0.85rem 1.8rem;
			border: 2px solid #000;
			border-radius: 8px;
			box-shadow: 4px 4px 0px #000;
			transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}

		.btn-neo:hover {
			transform: translate(-3px, -3px);
			box-shadow: 7px 7px 0px #000;
			background: #ffe300;
		}

		.btn-neo-secondary {
			background: #ffffff;
			color: #000;
		}

		.btn-neo-secondary:hover {
			background: #f0f0f0;
		}

		.star-deco {
			width: 45px;
			height: 45px;
			background-color: var(--primary-yellow);
			clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
			margin: 0 auto 1.5rem auto;
		}
	</style>
</head>

<body>

	<!-- Navbar -->
	<div id="navbar"></div>

	<!-- 404 Hero Section -->
	<main class="container error-container">
		<div class="error-code-badge">ERROR 404</div>

		<h1 class="error-title">
			Looks like you've <span style="font-style: italic; color: #555;">tinkered</span> into nowhere.
		</h1>

		<div class="error-card">
			<div class="error-card-badge">PAGE NOT FOUND</div>
			<div class="star-deco"></div>
			<p class="error-desc">
				The page you are looking for might have been moved, renamed, or never existed in this timeline. Don't worry, even master builders get lost sometimes!
			</p>
			<div class="error-actions">
				<a href="./" class="btn-neo">
					<ion-icon name="home-outline"></ion-icon> Return Home
				</a>
				<a href="./events/" class="btn-neo btn-neo-secondary">
					<ion-icon name="calendar-outline"></ion-icon> Explore Events
				</a>
			</div>
		</div>
	</main>

	<!-- Footer -->
	<div id="footer"></div>

</body>

</html>
